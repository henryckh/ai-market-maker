# Copy `.env.example` → `.env` first. Profiles: `with-futu`, `engine`.
# Empty AIMM_API_KEY / AIMM_AUTH_SECRET / POSTGRES_PASSWORD → secrets-init writes ./.secrets/
# Compose Postgres listens on 5433 (volume aimm_pg5433). Not published on the host.

services:
  secrets-init:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      AIMM_SECRETS_DIR: /run/aimm-secrets
      AIMM_API_KEY: ${AIMM_API_KEY:-}
      AIMM_AUTH_SECRET: ${AIMM_AUTH_SECRET:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - ./.secrets:/run/aimm-secrets
    command: ["python", "-m", "api.control_plane_secrets", "--write"]
    restart: "no"

  db:
    image: postgres:16
    environment:
      PGPORT: "5433"
      POSTGRES_DB: aimm
      POSTGRES_USER: aimm
      POSTGRES_PASSWORD_FILE: /run/aimm-secrets/postgres_password
    volumes:
      - aimm_pg5433:/var/lib/postgresql/data
      - ./.secrets:/run/aimm-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aimm -d aimm -p 5433"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AIMM_SECRETS_DIR: /run/aimm-secrets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5433"
    depends_on:
      db:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    entrypoint: ["/app/docker/api-entrypoint.sh"]
    volumes:
      - ./.secrets:/run/aimm-secrets:ro
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AIMM_DB_AUTOCREATE: "0"
      AIMM_SECRETS_DIR: /run/aimm-secrets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5433"
      AIMM_AUTH_SECRET: ${AIMM_AUTH_SECRET:-}
      AIMM_API_KEY: ${AIMM_API_KEY:-}
      AIMM_CORS_ORIGINS: ${AIMM_CORS_ORIGINS:-}
      MCP_CREDITS_ENABLED: ${MCP_CREDITS_ENABLED:-false}
      WEB_API_URL: ${WEB_API_URL:-http://web-api:3002}
      # LLM keys duplicated here for compose variable interpolation.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIMM_LLM_BASE_URL: ${AIMM_LLM_BASE_URL:-}
      AIMM_LLM_MODEL: ${AIMM_LLM_MODEL:-}
      # Futu optional — OpenD on host: host.docker.internal; in compose: futu-opend
      FUTU_OPEND_HOST: ${FUTU_OPEND_HOST:-host.docker.internal}
      FUTU_OPEND_QUOTE_PORT: ${FUTU_OPEND_QUOTE_PORT:-11111}
      FUTU_OPEND_TRADE_PORT: ${FUTU_OPEND_TRADE_PORT:-11112}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/app/docker/api-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
    ports:
      - "${AIMM_API_PUBLISH:-127.0.0.1:8001}:8001"
    volumes:
      - ./.runs:/app/.runs
      - ./config:/app/config:ro
      - ./scripts:/app/scripts:ro
      - ./.secrets:/run/aimm-secrets:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      AIMM_SECRETS_DIR: /run/aimm-secrets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5433"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      AIMM_LLM_BASE_URL: ${AIMM_LLM_BASE_URL:-}
      AIMM_LLM_MODEL: ${AIMM_LLM_MODEL:-}
      FUTU_OPEND_HOST: ${FUTU_OPEND_HOST:-host.docker.internal}
      FUTU_OPEND_QUOTE_PORT: ${FUTU_OPEND_QUOTE_PORT:-11111}
      FUTU_OPEND_TRADE_PORT: ${FUTU_OPEND_TRADE_PORT:-11112}
      PLATFORM_WORKER_AUTO_EXECUTE: ${PLATFORM_WORKER_AUTO_EXECUTE:-0}
      PLATFORM_WORKER_INTERVAL_SEC: ${PLATFORM_WORKER_INTERVAL_SEC:-2.0}
      PLATFORM_WORKER_BATCH: ${PLATFORM_WORKER_BATCH:-200}
      PLATFORM_WORKER_CURSOR: ${PLATFORM_WORKER_CURSOR:-default}
      PLATFORM_SYNC_LOCAL_BACKTESTS: ${PLATFORM_SYNC_LOCAL_BACKTESTS:-0}
      PLATFORM_SYNC_LOCAL_BACKTESTS_EVERY_SEC: ${PLATFORM_SYNC_LOCAL_BACKTESTS_EVERY_SEC:-10}
    entrypoint: ["/app/docker/api-entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      secrets-init:
        condition: service_completed_successfully
    volumes:
      - ./.runs:/app/.runs
      - ./config:/app/config:ro
      - ./.secrets:/run/aimm-secrets:ro

  engine:
    profiles: ["engine"]
    image: henry-ai-market-maker-api
    env_file:
      - .env
    environment:
      MODE: ${MODE:-paper}
      TICKER: ${TICKER:-BTC/USDT}
      STRATEGY_INTERVAL_SEC: ${STRATEGY_INTERVAL_SEC:-900}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    depends_on:
      - api
    volumes:
      - ./.runs:/app/.runs
    command: >
      sh -lc "while true; do python src/main.py --mode \"$$MODE\" --ticker \"$$TICKER\" || true; sleep \"$$STRATEGY_INTERVAL_SEC\"; done"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      FLOW_API_BASE_URL: http://api:8001
      AIMM_API_KEY: ${AIMM_API_KEY:-}
      AIMM_SECRETS_DIR: /run/aimm-secrets
      NODE_ENV: production
      FLOW_ALLOW_MOCK_FALLBACK: "0"
      NEXT_PUBLIC_FLOW_ALLOW_MOCK_FALLBACK: "0"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - ./.secrets:/run/aimm-secrets:ro
    ports:
      - "${AIMM_WEB_PUBLISH:-127.0.0.1:3000}:3000"

  futu-opend:
    profiles: ["with-futu"]
    image: ${FUTU_OPEND_IMAGE:-registry.cn-hangzhou.aliyuncs.com/futu-openapi/opend:latest}
    restart: unless-stopped
    ports:
      - "${FUTU_OPEND_QUOTE_PORT:-11111}:11111"
      - "${FUTU_OPEND_TRADE_PORT:-11112}:11112"
    # When this profile is up, set FUTU_OPEND_HOST=futu-opend in .env.

volumes:
  aimm_pg5433:
